<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

 <title>우리 집 영어 패턴 - 2개월차</title>


  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background-color: #f3f7ff;
      color: #1f2937;
      font-family: Arial, "Apple SD Gothic Neo", sans-serif;
    }

    button {
      font-family: inherit;
    }

    .app {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .app-header {
      margin-bottom: 22px;
    }

    .app-title {
      margin: 0 0 8px;
      font-size: 36px;
    }

    .app-description {
      margin: 0;
      color: #64748b;
      font-size: 18px;
      line-height: 1.6;
    }

    /*
      30일 학습 버튼
    */
    .day-menu {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(92px, 1fr));
      gap: 8px;
      margin-bottom: 18px;
    }

    .day-button {
      min-height: 50px;
      padding: 10px;
      border: 2px solid #bfdbfe;
      border-radius: 10px;
      background-color: white;
      color: #1e40af;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .day-button:hover {
      background-color: #eff6ff;
    }

    .day-button.selected {
      border-color: #2563eb;
      background-color: #2563eb;
      color: white;
    }
/*
  일차 버튼 아래쪽의 상태 표시
*/
.day-state {
  display: block;
  margin-top: 4px;
  font-size: 12px;
  font-weight: bold;
}

/*
  완료한 학습
*/
.day-button.completed {
  border-color: #22c55e;
  background-color: #f0fdf4;
  color: #166534;
}

/*
  현재 학습할 일차
*/
.day-button.current {
  border-color: #f59e0b;
  background-color: #fffbeb;
  color: #92400e;
}

/*
  아직 열리지 않은 학습
*/
.day-button.locked {
  border-color: #cbd5e1;
  background-color: #f1f5f9;
  color: #94a3b8;
  cursor: not-allowed;
}

/*
  현재 화면에서 선택된 일차
*/
.day-button.selected {
  outline: 3px solid #2563eb;
  outline-offset: 2px;
}

    /*
      학습 내용
    */
    .lesson-card {
      padding: 30px;
      border: 2px solid #dbeafe;
      border-radius: 20px;
      background-color: white;
    }

    .day-label {
      display: inline-block;
      margin: 0 0 12px;
      padding: 6px 10px;
      border-radius: 7px;
      background-color: #dbeafe;
      color: #1e40af;
      font-size: 16px;
      font-weight: bold;
    }

    .lesson-title {
      margin: 0 0 10px;
      font-size: 30px;
    }

    .lesson-focus {
      margin: 0 0 10px;
      color: #2563eb;
      font-size: 21px;
      font-weight: bold;
    }

    .lesson-guide {
      margin: 0 0 24px;
      color: #475569;
      font-size: 18px;
      line-height: 1.7;
    }

    /*
      선택한 문장
    */
    .sentence-box {
      padding: 26px 20px;
      border: 2px solid #bbf7d0;
      border-radius: 16px;
      background-color: #f0fdf4;
      text-align: center;
    }

    .sentence-label {
      margin: 0 0 10px;
      color: #166534;
      font-size: 16px;
      font-weight: bold;
    }

    .main-sentence {
      margin: 0 0 12px;
      color: #14532d;
      font-size: 40px;
      line-height: 1.35;
    }

    .main-meaning {
      margin: 0;
      color: #3f6212;
      font-size: 21px;
      line-height: 1.5;
    }

    /*
      문장 선택
    */
    .section-title {
      margin: 28px 0 12px;
      font-size: 21px;
    }

    .sentence-choices {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .sentence-button {
      width: 100%;
      min-height: 68px;
      padding: 14px 18px;
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      background-color: white;
      color: #1f2937;
      text-align: left;
      cursor: pointer;
    }

    .sentence-button:hover {
      border-color: #60a5fa;
      background-color: #eff6ff;
    }

    .sentence-button.selected {
      border-color: #2563eb;
      background-color: #dbeafe;
    }

    .choice-english {
      display: block;
      margin-bottom: 5px;
      color: #1e3a8a;
      font-size: 20px;
      font-weight: bold;
    }

    .choice-korean {
      display: block;
      color: #64748b;
      font-size: 16px;
    }

    /*
      문장 듣기
    */
    .listen-button {
      width: 100%;
      min-height: 62px;
      margin-top: 20px;
      padding: 14px 18px;
      border: 2px solid #16a34a;
      border-radius: 14px;
      background-color: #16a34a;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .listen-button:hover {
      border-color: #15803d;
      background-color: #15803d;
    }

    .status {
      min-height: 26px;
      margin: 12px 0 0;
      color: #166534;
      font-size: 17px;
      font-weight: bold;
      text-align: center;
    }

    /*
      블록 조립 퀴즈
    */
    .quiz-card {
      margin-top: 28px;
      padding: 24px;
      border: 2px solid #fed7aa;
      border-radius: 16px;
      background-color: #fffaf5;
    }

    .quiz-title {
      margin: 0 0 8px;
      color: #9a3412;
      font-size: 24px;
    }

    .quiz-guide {
      margin: 0 0 18px;
      color: #7c2d12;
      font-size: 17px;
      line-height: 1.6;
    }

    .quiz-label {
      margin: 18px 0 8px;
      color: #475569;
      font-size: 16px;
      font-weight: bold;
    }

    .answer-zone {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px;
      min-height: 76px;
      padding: 14px;
      border: 2px dashed #fb923c;
      border-radius: 12px;
      background-color: white;
    }

    .answer-placeholder {
      margin: 0;
      color: #94a3b8;
      font-size: 16px;
    }

    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      min-height: 64px;
      padding: 12px;
      border: 1px solid #fdba74;
      border-radius: 12px;
      background-color: #fff7ed;
    }

    .word-block {
      min-height: 46px;
      padding: 9px 14px;
      border: 2px solid #93c5fd;
      border-radius: 10px;
      background-color: white;
      color: #1e3a8a;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .word-block:hover {
      background-color: #eff6ff;
    }

    .word-block.answer-block {
      border-color: #fb923c;
      background-color: #ffedd5;
      color: #9a3412;
    }

    .quiz-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .quiz-action-button {
      min-height: 54px;
      padding: 12px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .reset-button {
      border: 2px solid #94a3b8;
      background-color: white;
      color: #475569;
    }

    .check-button {
      border: 2px solid #ea580c;
      background-color: #ea580c;
      color: white;
    }

    .quiz-feedback {
      min-height: 29px;
      margin: 14px 0 0;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
    }

    .quiz-feedback.correct {
      color: #15803d;
    }

    .quiz-feedback.incorrect {
      color: #dc2626;
    }
/*
  퀴즈를 풀 때 영어 정답을 가립니다.
  한국어 뜻은 계속 보입니다.
*/
.lesson-card.answer-hidden .main-sentence,
.lesson-card.answer-hidden .choice-english {
  visibility: hidden;
}

.quiz-korean-box {
  margin: 16px 0;
  padding: 18px;
  border: 2px solid #f59e0b;
  border-radius: 12px;
  background-color: white;
}

.quiz-korean-label {
  display: block;
  margin-bottom: 8px;
  color: #92400e;
  font-size: 15px;
  font-weight: bold;
}

.quiz-korean-prompt {
  margin: 0;
  color: #78350f;
  font-size: 22px;
  font-weight: bold;
  line-height: 1.55;
}

.toggle-answer-button {
  border: 2px solid #2563eb;
  background-color: white;
  color: #1e40af;
}
/*
  학습 완료 영역
*/
.completion-panel {
  margin-top: 24px;
  padding: 20px;
  border: 2px solid #bbf7d0;
  border-radius: 14px;
  background-color: #f0fdf4;
}

.complete-lesson-button {
  width: 100%;
  min-height: 60px;
  padding: 14px 18px;
  border: 2px solid #16a34a;
  border-radius: 12px;
  background-color: #16a34a;
  color: white;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}

.complete-lesson-button:hover:not(:disabled) {
  border-color: #15803d;
  background-color: #15803d;
}

.complete-lesson-button:disabled {
  border-color: #86efac;
  background-color: #dcfce7;
  color: #166534;
  cursor: default;
}

.completion-message {
  margin: 12px 0 0;
  color: #166534;
  font-size: 16px;
  font-weight: bold;
  line-height: 1.6;
  text-align: center;
}

    /*
      이전 및 다음 학습
    */
    .navigation {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 24px;
    }

    .navigation-button {
      min-height: 58px;
      padding: 12px 16px;
      border: 2px solid #94a3b8;
      border-radius: 12px;
      background-color: white;
      color: #334155;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .navigation-button:hover:not(:disabled) {
      border-color: #2563eb;
      background-color: #eff6ff;
      color: #1e40af;
    }

    .navigation-button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /*
      작은 화면과 아이패드
    */
    @media (max-width: 650px) {
      body {
        padding: 12px;
      }

      .app-title {
        font-size: 29px;
      }

      .day-menu {
        grid-template-columns:
          repeat(auto-fit, minmax(78px, 1fr));
      }

      .lesson-card {
        padding: 19px;
      }

      .lesson-title {
        font-size: 25px;
      }

      .main-sentence {
        font-size: 31px;
      }

      .main-meaning {
        font-size: 18px;
      }

      .quiz-card {
        padding: 18px;
      }

      .quiz-buttons,
      .navigation {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="app-header">
      <h1 class="app-title">
  우리 집 영어 패턴 · 2개월차
</h1>


      <p class="app-description">
        I want 패턴을 30일 동안 확장하고 변형하며 학습합니다.
      </p>
      <p>
  <a href="index.html">
    1개월차 I like 학습으로 돌아가기
  </a>
</p>

    </header>

    <nav
      id="day-menu"
      class="day-menu"
      aria-label="학습 일차 선택"
    ></nav>

    <section id="lesson-card" class="lesson-card">

      <p id="day-label" class="day-label"></p>

      <h2 id="lesson-title" class="lesson-title"></h2>

      <p id="lesson-focus" class="lesson-focus"></p>

      <p id="lesson-guide" class="lesson-guide"></p>

      <div class="sentence-box">
        <p class="sentence-label">오늘의 선택 문장</p>

        <p id="main-sentence" class="main-sentence"></p>

        <p id="main-meaning" class="main-meaning"></p>
      </div>

      <h3 class="section-title">
        연습할 문장을 선택하세요.
      </h3>

      <div
        id="sentence-choices"
        class="sentence-choices"
      ></div>

      <button
        id="listen-button"
        class="listen-button"
        type="button"
      >
        선택한 문장 듣기
      </button>

      <p
        id="status"
        class="status"
        aria-live="polite"
      ></p>

      <section class="quiz-card">
        <h3 class="quiz-title">
          단어 블록 조립 퀴즈
        </h3>

        <p class="quiz-guide">
          한국어 문장을 보고 영어 블록을 순서대로 누르세요.
정답에 사용하지 않는 헷갈리는 블록도 섞여 있습니다.
모든 블록을 사용할 필요는 없습니다.

        </p>
<div class="quiz-korean-box">
  <span class="quiz-korean-label">
    한국어 문제
  </span>

  <p
    id="quiz-korean-prompt"
    class="quiz-korean-prompt"
  ></p>
</div>

        <p class="quiz-label">내가 만든 문장</p>

        <div
          id="answer-zone"
          class="answer-zone"
        ></div>

        <p class="quiz-label">사용할 단어</p>

        <div
          id="word-bank"
          class="word-bank"
        ></div>

        <div class="quiz-buttons">
  <button
    id="toggle-answer-button"
    class="quiz-action-button toggle-answer-button"
    type="button"
  >
    영어 문장 가리기
  </button>

  <button
    id="reset-quiz-button"
    class="quiz-action-button reset-button"
    type="button"
  >
    블록 다시 섞기
  </button>

  <button
    id="check-answer-button"
    class="quiz-action-button check-button"
    type="button"
  >
    정답 확인
  </button>
</div>

        <p
          id="quiz-feedback"
          class="quiz-feedback"
          aria-live="polite"
        ></p>
            </section>

      <section class="completion-panel">
        <button
          id="complete-lesson-button"
          class="complete-lesson-button"
          type="button"
        >
          학습 완료하기
        </button>

        <p
          id="completion-message"
          class="completion-message"
          aria-live="polite"
        ></p>
      </section>

      <div class="navigation">

        <button
          id="previous-button"
          class="navigation-button"
          type="button"
        >
          이전 학습
        </button>

        <button
          id="next-button"
          class="navigation-button"
          type="button"
        >
          다음 학습
        </button>
      </div>
    </section>
  </main>

  <script>
    /*
      문장 자료를 간단하게 만드는 함수입니다.
    */
    /*
  세 번째 값에는 퀴즈에 함께 섞을
  헷갈리는 블록을 넣을 수 있습니다.
*/
function sentence(
  english,
  korean,
  distractors = []
) {
  return {
    english: english,
    korean: korean,
    distractors: distractors
  };
}


    /*
      30일 학습 자료입니다.
    */
    const lessons = [
  {
    day: 1,
    title: "원하는 음식과 음료 말하기",
    focus: "I want + 음식 또는 음료",
    guide:
      "I want 뒤에 원하는 음식이나 음료를 넣어 말해 봅시다.",
    sentences: [
      sentence(
        "I want some water.",
        "나는 물을 좀 원해요."
      ),
      sentence(
        "I want some juice.",
        "나는 주스를 좀 원해요."
      ),
      sentence(
        "I want an apple.",
        "나는 사과 한 개를 원해요."
      )
    ]
  },

  {
    day: 2,
    title: "원하는 물건 말하기",
    focus: "I want + 물건",
    guide:
      "가지고 싶은 물건을 I want 뒤에 넣어 말해 봅시다.",
    sentences: [
      sentence(
        "I want a new pencil.",
        "나는 새 연필을 원해요."
      ),
      sentence(
        "I want a blue backpack.",
        "나는 파란색 가방을 원해요."
      ),
      sentence(
        "I want that book.",
        "나는 저 책을 원해요."
      )
    ]
  },

  {
    day: 3,
    title: "하고 싶은 활동 말하기",
    focus: "I want to + 동사원형",
    guide:
      "하고 싶은 활동을 말할 때 want 뒤에 to와 동사원형을 사용합니다.",
    sentences: [
      sentence(
        "I want to read.",
        "나는 책을 읽고 싶어요."
      ),
      sentence(
        "I want to draw.",
        "나는 그림을 그리고 싶어요."
      ),
      sentence(
        "I want to swim.",
        "나는 수영하고 싶어요."
      )
    ]
  },

  {
    day: 4,
    title: "활동의 대상 붙이기",
    focus: "I want to + 활동 + 대상",
    guide:
      "하고 싶은 활동 뒤에 그 활동의 대상을 붙여 봅시다.",
    sentences: [
      sentence(
        "I want to read this book.",
        "나는 이 책을 읽고 싶어요."
      ),
      sentence(
        "I want to draw a cat.",
        "나는 고양이를 그리고 싶어요."
      ),
      sentence(
        "I want to play soccer.",
        "나는 축구를 하고 싶어요."
      )
    ]
  },

  {
    day: 5,
    title: "가고 싶은 장소 말하기",
    focus: "I want to go to + 장소",
    guide:
      "가고 싶은 장소를 go to 뒤에 붙여 말해 봅시다.",
    sentences: [
      sentence(
        "I want to go to the park.",
        "나는 공원에 가고 싶어요."
      ),
      sentence(
        "I want to go to the library.",
        "나는 도서관에 가고 싶어요."
      ),
      sentence(
        "I want to go to the beach.",
        "나는 해변에 가고 싶어요."
      )
    ]
  },

  {
    day: 6,
    title: "함께하고 싶은 사람 말하기",
    focus: "I want to + 활동 + with + 사람",
    guide:
      "누구와 함께 활동하고 싶은지 말해 봅시다.",
    sentences: [
      sentence(
        "I want to play with my friends.",
        "나는 친구들과 놀고 싶어요."
      ),
      sentence(
        "I want to cook with my dad.",
        "나는 아빠와 요리하고 싶어요."
      ),
      sentence(
        "I want to read with my mom.",
        "나는 엄마와 책을 읽고 싶어요."
      )
    ]
  },

  {
    day: 7,
    title: "하고 싶은 시간 말하기",
    focus: "I want to + 활동 + 시간",
    guide:
      "언제 활동하고 싶은지 시간을 붙여 말해 봅시다.",
    sentences: [
      sentence(
        "I want to play after school.",
        "나는 방과 후에 놀고 싶어요."
      ),
      sentence(
        "I want to read before bed.",
        "나는 자기 전에 책을 읽고 싶어요."
      ),
      sentence(
        "I want to swim this weekend.",
        "나는 이번 주말에 수영하고 싶어요."
      )
    ]
  },

  {
    day: 8,
    title: "원하는 물건 질문하기",
    focus: "Do you want + 명사?",
    guide:
      "상대방이 무엇을 원하는지 Do you want를 사용해 물어봅시다.",
    sentences: [
      sentence(
        "Do you want some water?",
        "너는 물을 좀 원하니?"
      ),
      sentence(
        "Do you want an apple?",
        "너는 사과 한 개를 원하니?"
      ),
      sentence(
        "Do you want this book?",
        "너는 이 책을 원하니?"
      )
    ]
  },

  {
    day: 9,
    title: "하고 싶은 활동 질문하기",

    /*
      현재 선택 상태
    */

/*
  과정마다 완료 기록을 따로 저장합니다.

  index.html은 month1,
  month2.html은 month2를 사용합니다.
*/
const COURSE_ID = "month2";

/*
  localStorage에 사용할 저장 이름입니다.
*/
const COMPLETED_DAYS_KEY =
  `english-pattern-${COURSE_ID}-completed-days`;

/*
  저장된 완료 일차를 불러옵니다.
*/
function loadCompletedDays() {
  const savedText =
    localStorage.getItem(COMPLETED_DAYS_KEY);

  if (!savedText) {
    return [];
  }

  try {
    const savedDays = JSON.parse(savedText);

    if (!Array.isArray(savedDays)) {
      return [];
    }

    /*
      올바른 일차만 남기고
      중복된 일차를 제거합니다.
    */
    const validDays = savedDays.filter(
      function (day) {
        return (
          Number.isInteger(day) &&
          day >= 1 &&
          day <= lessons.length
        );
      }
    );

    return [...new Set(validDays)].sort(
      function (firstDay, secondDay) {
        return firstDay - secondDay;
      }
    );
  } catch (error) {
    console.error(
      "완료 기록을 불러오지 못했습니다.",
      error
    );

    return [];
  }
}

/*
  완료 기록을 브라우저에 저장합니다.
*/
function saveCompletedDays() {
  localStorage.setItem(
    COMPLETED_DAYS_KEY,
    JSON.stringify(completedDays)
  );
}

/*
  해당 일차가 완료되었는지 확인합니다.
*/
function isLessonCompleted(day) {
  return completedDays.includes(day);
}

/*
  첫 번째 미완료 일차의 배열 번호를 찾습니다.

  모두 완료한 경우에는 -1을 반환합니다.
*/
function getNextIncompleteLessonIndex() {
  return lessons.findIndex(
    function (lesson) {
      return !isLessonCompleted(lesson.day);
    }
  );
}

/*
  해당 일차에 들어갈 수 있는지 확인합니다.

  완료한 일차와 현재 학습해야 할
  첫 번째 미완료 일차만 열립니다.
*/
function isLessonUnlocked(lessonIndex) {
  if (
    lessonIndex < 0 ||
    lessonIndex >= lessons.length
  ) {
    return false;
  }

  const lesson = lessons[lessonIndex];

  if (isLessonCompleted(lesson.day)) {
    return true;
  }

  const nextIncompleteIndex =
    getNextIncompleteLessonIndex();

  /*
    모든 수업을 완료했다면

}

    /*
      배열의 순서를 무작위로 섞습니다.
    */
    function shuffleArray(originalArray) {
      const copiedArray = [...originalArray];

      for (
        let index = copiedArray.length - 1;
        index > 0;
        index--
      ) {
        const randomIndex =
          Math.floor(Math.random() * (index + 1));

        const temporaryValue = copiedArray[index];

        copiedArray[index] =
          copiedArray[randomIndex];

        copiedArray[randomIndex] =
          temporaryValue;
      }

      return copiedArray;
    }

    /*
      새 블록 조립 문제를 만듭니다.
    */
   /*
  마침표와 물음표를 제외하고
  단어의 기본 모양을 확인합니다.
*/
function normalizeWord(word) {
  return word
    .toLowerCase()
    .replace(/[.,?!]/g, "");
}

/*
  정답 문장에 따라 헷갈리는 블록을
  자동으로 추가합니다.
*/
function createAutomaticDistractors(
  englishSentence
) {
  const words =
    englishSentence
      .split(/\s+/)
      .map(function (word) {
        return normalizeWord(word);
      });

  const distractors = [];

  /*
    do, does, did 비교
  */
  if (words.includes("do")) {
    distractors.push("Does", "Did");
  }

  if (words.includes("does")) {
    distractors.push("Do", "Did");
  }

  if (words.includes("did")) {
    distractors.push("Do", "Does");
  }

  /*
    don't, doesn't, didn't 비교
  */
  if (words.includes("don't")) {
    distractors.push("doesn't", "didn't");
  }

  if (words.includes("doesn't")) {
    distractors.push("don't", "didn't");
  }

  if (words.includes("didn't")) {
    distractors.push("don't", "doesn't");
  }

  /*
    like, likes, liked 비교
  */
  if (words.includes("like")) {
    distractors.push("likes", "liked");
  }

  if (words.includes("likes")) {
    distractors.push("like", "liked");
  }

  if (words.includes("liked")) {
    distractors.push("like", "likes");
  }
/*
  want, wants, wanted 비교
*/
if (words.includes("want")) {
  distractors.push(
    "wants",
    "wanted"
  );
}

if (words.includes("wants")) {
  distractors.push(
    "want",
    "wanted"
  );
}

if (words.includes("wanted")) {
  distractors.push(
    "want",
    "wants"
  );
}

/*
  to 뒤의 동사 형태 비교
*/
if (words.includes("read")) {
  distractors.push(
    "reads",
    "reading"
  );
}

if (words.includes("play")) {
  distractors.push(
    "plays",
    "playing"
  );
}

if (words.includes("go")) {
  distractors.push(
    "goes",
    "going",
    "went"
  );
}

/*
  would와 일반 질문 표현 비교
*/
if (words.includes("would")) {
  distractors.push(
    "Do",
    "Does",
    "Did"
  );
}

  /*
    주어 비교
  */
  if (words.includes("i")) {
    distractors.push("She", "They");
  }

  if (words.includes("she")) {
    distractors.push("I", "They");
  }

  if (words.includes("he")) {
    distractors.push("She", "They");
  }

  if (words.includes("we")) {
    distractors.push("I", "She");
  }

  if (words.includes("they")) {
    distractors.push("She", "I");
  }

  /*
    빈도부사 비교
  */
  if (words.includes("always")) {
    distractors.push("usually", "never");
  }

  if (words.includes("usually")) {
    distractors.push("always", "sometimes");
  }

  if (words.includes("often")) {
    distractors.push("always", "rarely");
  }

  if (words.includes("sometimes")) {
    distractors.push("usually", "never");
  }

  if (words.includes("rarely")) {
    distractors.push("often", "always");
  }

  if (words.includes("never")) {
    distractors.push("always", "sometimes");
  }

  return distractors;
}

    /*
  새 블록 조립 문제를 만듭니다.
*/
function createQuiz() {
  const currentSentence = getCurrentSentence();

  /*
    한국어 문제를 퀴즈에 표시합니다.
  */
  quizKoreanPrompt.textContent =
    currentSentence.korean;

  /*
    정답 문장을 띄어쓰기 기준으로 나눕니다.
  */
  const correctWords =
    currentSentence.english.split(/\s+/);

  const correctBlocks =
    correctWords.map(function (word, index) {
      return {
        id: `correct-${index}`,
        text: word,
        isCorrect: true
      };
    });

  /*
    자동 오답과 직접 지정한 오답을 합칩니다.
  */
  const automaticDistractors =
    createAutomaticDistractors(
      currentSentence.english
    );

  const customDistractors =
    currentSentence.distractors || [];

  const combinedDistractors = [
    ...automaticDistractors,
    ...customDistractors
  ];

  /*
    똑같은 오답 블록이 여러 번 들어가지 않게 합니다.
  */
  const uniqueDistractors = [
    ...new Set(combinedDistractors)
  ];

  /*
    정답에 이미 있는 블록과 똑같은 오답은 제외합니다.
  */
  const correctLowercaseWords =
    correctWords.map(function (word) {
      return word.toLowerCase();
    });

  const filteredDistractors =
    uniqueDistractors.filter(
      function (distractor) {
        return !correctLowercaseWords.includes(
          distractor.toLowerCase()
        );
      }
    );

  /*
    한 문제에 오답이 너무 많지 않도록
    최대 7개까지만 사용합니다.
  */
  const distractorBlocks =
    shuffleArray(filteredDistractors)
      .slice(0, 7)
      .map(function (word, index) {
        return {
          id: `distractor-${index}`,
          text: word,
          isCorrect: false
        };
      });

  /*
    정답과 오답을 모두 합쳐서 섞습니다.
  */
  shuffledBlocks = shuffleArray([
    ...correctBlocks,
    ...distractorBlocks
  ]);

  selectedBlockIds = [];

  quizFeedback.textContent = "";
  quizFeedback.className = "quiz-feedback";

  renderQuiz();
}


    /*
      단어 블록 버튼 하나를 만듭니다.
    */
    function createWordBlock(
      block,
      additionalClass,
      clickFunction
    ) {
      const button = document.createElement("button");

      button.type = "button";
      button.className =
        `word-block ${additionalClass}`;

      button.textContent = block.text;

      button.addEventListener(
        "click",
        clickFunction
      );

      return button;
    }

    /*
      퀴즈 화면을 다시 그립니다.
    */
    function renderQuiz() {
      answerZone.innerHTML = "";
      wordBank.innerHTML = "";

      if (selectedBlockIds.length === 0) {
        const placeholder =
          document.createElement("p");

        placeholder.className =
          "answer-placeholder";

        placeholder.textContent =
          "아래 단어를 순서대로 눌러 보세요.";

        answerZone.appendChild(placeholder);
      }

      /*
        선택된 블록을 답안 영역에 표시합니다.
      */
      selectedBlockIds.forEach(function (blockId) {
        const block = shuffledBlocks.find(
          function (currentBlock) {
            return currentBlock.id === blockId;
          }
        );

        const button = createWordBlock(
          block,
          "answer-block",
          function () {
            removeBlockFromAnswer(blockId);
          }
        );

        answerZone.appendChild(button);
      });

      /*
        아직 선택하지 않은 블록을 단어 영역에 표시합니다.
      */
      shuffledBlocks.forEach(function (block) {
        const isAlreadySelected =
          selectedBlockIds.includes(block.id);

        if (!isAlreadySelected) {
          const button = createWordBlock(
            block,
            "",
            function () {
              addBlockToAnswer(block.id);
            }
          );

          wordBank.appendChild(button);
        }
      });
    }

    /*
      단어를 답안에 추가합니다.
    */
    function addBlockToAnswer(blockId) {
      selectedBlockIds.push(blockId);

      quizFeedback.textContent = "";
      quizFeedback.className = "quiz-feedback";

      renderQuiz();
    }

    /*
      답안의 단어를 다시 단어 영역으로 내립니다.
    */
    function removeBlockFromAnswer(blockId) {
      const selectedPosition =
        selectedBlockIds.indexOf(blockId);

      if (selectedPosition !== -1) {
        selectedBlockIds.splice(
          selectedPosition,
          1
        );
      }

      quizFeedback.textContent = "";
      quizFeedback.className = "quiz-feedback";

      renderQuiz();
    }

    /*
      사용자가 만든 영어 문장을 가져옵니다.
    */
    function getUserAnswer() {
      return selectedBlockIds
        .map(function (blockId) {
          const block = shuffledBlocks.find(
            function (currentBlock) {
              return currentBlock.id === blockId;
            }
          );

          return block.text;
        })
        .join(" ");
    }

   /*
  정답을 확인합니다.
  사용하지 않은 오답 블록이 남아 있어도 괜찮습니다.
*/
function checkQuizAnswer() {

    /*
  다른 일차를 선택합니다.
*/
function selectLesson(lessonIndex) {
  if (!isLessonUnlocked(lessonIndex)) {
    status.textContent =
      "이 학습은 아직 열리지 않았습니다.";

    return;
  }

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }

  currentLessonIndex = lessonIndex;
  currentSentenceIndex = 0;

  const lesson = getCurrentLesson();

  if (isLessonCompleted(lesson.day)) {
    status.textContent =
      `${lesson.day}일차는 완료한 학습입니다. 자유롭게 복습할 수 있습니다.`;
  } else {
    status.textContent =
      `${lesson.day}일차 학습을 시작합니다.`;
  }

  updateLessonScreen();
}


    /*
      다른 문장 선택
    */
    function selectSentence(sentenceIndex) {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }

      currentSentenceIndex = sentenceIndex;

      const currentSentence = getCurrentSentence();

      if (getCurrentLesson().day >= 28) {
  status.textContent =
    "복습 문제를 선택했어요. 한국어를 보고 영어 문장을 만들어 보세요.";
} else {
  status.textContent =
    `"${currentSentence.english}" 문장을 선택했어요.`;
}


      updateLessonScreen();
    }

    /*
      영어 문장 듣기
    */
    function speakCurrentSentence() {
      if (!("speechSynthesis" in window)) {
        status.textContent =
          "이 브라우저에서는 음성 기능을 사용할 수 없어요.";

        return;
      }

      const currentSentence = getCurrentSentence();

      window.speechSynthesis.cancel();

      const speech =
        new SpeechSynthesisUtterance(
          currentSentence.english
        );

      speech.lang = "en-US";
      speech.rate = 0.72;
      speech.pitch = 1;

      speech.onstart = function () {
        status.textContent =
          "영어 문장을 들려주고 있어요.";
      };

      speech.onend = function () {
        status.textContent =
          "이번에는 소리 내어 따라 말해 보세요.";
      };

      speech.onerror = function () {
        status.textContent =
          "음성을 재생하지 못했어요. 다시 눌러 보세요.";
      };

      window.speechSynthesis.speak(speech);
    }

    /*
      이전 학습
    */
    function goToPreviousLesson() {
      if (currentLessonIndex > 0) {
        selectLesson(currentLessonIndex - 1);

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      }
    }

    /*
      다음 학습
    */
    /*
  다음 학습으로 이동합니다.
*/
function goToNextLesson() {
  const nextLessonIndex =
    currentLessonIndex + 1;

  if (nextLessonIndex >= lessons.length) {
    return;
  }

  if (!isLessonUnlocked(nextLessonIndex)) {
    status.textContent =
      "현재 일차를 완료하면 다음 학습이 열립니다.";

    return;
  }

  selectLesson(nextLessonIndex);

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


    /*
      버튼과 기능 연결
    */
   
    listenButton.addEventListener(
      "click",
      speakCurrentSentence
    );
toggleAnswerButton.addEventListener(
  "click",
  toggleAnswerVisibility
);

    resetQuizButton.addEventListener(
      "click",
      createQuiz
    );

    checkAnswerButton.addEventListener(
      "click",
      checkQuizAnswer
    );
completeLessonButton.addEventListener(
  "click",
  completeCurrentLesson
);

    previousButton.addEventListener(
      "click",
      goToPreviousLesson
    );

    nextButton.addEventListener(
      "click",
      goToNextLesson
    );

    /*
      처음 화면 표시
    */
   /*
  저장된 진행 상태에 맞는 학습을 표시합니다.
*/
updateLessonScreen();

const nextIncompleteIndex =
  getNextIncompleteLessonIndex();

if (nextIncompleteIndex === -1) {
  status.textContent =
    "30일 학습을 모두 완료했습니다. 원하는 일차를 선택해 복습하세요.";
} else {
  status.textContent =
    `${lessons[currentLessonIndex].day}일차 학습을 이어서 진행합니다.`;
}

  </script>
